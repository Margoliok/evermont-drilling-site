<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" fill="none" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#c4c9cf" stroke-width="1"/>
    </pattern>
    <pattern id="lattice" width="40" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 0 L40 34 M40 0 L0 34" stroke="#1d2b3a" stroke-width="1" opacity=".55"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b95a1"/>
    </marker>
  </defs>

  <!-- ground -->
  <rect x="40" y="462" width="560" height="60" fill="url(#hatch)"/>
  <line x1="40" y1="462" x2="600" y2="462" stroke="#8b95a1" stroke-width="1.5"/>

  <!-- drill string below ground -->
  <line x1="150" y1="462" x2="150" y2="520" stroke="#1b4e9b" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M142 514 h16 l-3 8 h-10 z" fill="#1b4e9b"/>

  <!-- outriggers -->
  <path d="M96 420 v34 h-14 v8 h36 v-8 h-14 v-34" stroke="#1d2b3a" stroke-width="1.6"/>
  <path d="M396 420 v34 h-14 v8 h36 v-8 h-14 v-34" stroke="#1d2b3a" stroke-width="1.6"/>

  <!-- chassis -->
  <rect x="70" y="392" width="460" height="30" rx="3" stroke="#1d2b3a" stroke-width="2"/>
  <line x1="70" y1="407" x2="530" y2="407" stroke="#1d2b3a" stroke-width="1" opacity=".4"/>

  <!-- cab -->
  <path d="M440 392 V320 a8 8 0 0 1 8 -8 H508 l26 40 V392" stroke="#1d2b3a" stroke-width="2"/>
  <path d="M456 326 H504 l18 28 H456 z" stroke="#8b95a1" stroke-width="1.4"/>
  <line x1="490" y1="362" x2="506" y2="362" stroke="#1d2b3a" stroke-width="1.5"/>

  <!-- wheels -->
  <g stroke="#1d2b3a" stroke-width="2">
    <circle cx="150" cy="442" r="24"/><circle cx="150" cy="442" r="9"/>
    <circle cx="214" cy="442" r="24"/><circle cx="214" cy="442" r="9"/>
    <circle cx="480" cy="442" r="24"/><circle cx="480" cy="442" r="9"/>
  </g>

  <!-- power unit -->
  <rect x="236" y="318" width="190" height="74" rx="3" stroke="#1d2b3a" stroke-width="2"/>
  <g stroke="#8b95a1" stroke-width="1.2">
    <line x1="252" y1="332" x2="252" y2="378"/><line x1="262" y1="332" x2="262" y2="378"/>
    <line x1="272" y1="332" x2="272" y2="378"/><line x1="282" y1="332" x2="282" y2="378"/>
    <line x1="292" y1="332" x2="292" y2="378"/>
  </g>
  <rect x="314" y="332" width="96" height="46" rx="2" stroke="#8b95a1" stroke-width="1.2"/>
  <line x1="402" y1="318" x2="402" y2="292" stroke="#1d2b3a" stroke-width="2"/>
  <!-- winch drum -->
  <circle cx="206" cy="372" r="16" stroke="#1d2b3a" stroke-width="2"/>
  <circle cx="206" cy="372" r="5" fill="#1d2b3a"/>

  <!-- mast -->
  <rect x="128" y="44" width="44" height="348" stroke="#1d2b3a" stroke-width="2.2" fill="url(#lattice)"/>
  <rect x="120" y="30" width="60" height="16" rx="2" stroke="#1d2b3a" stroke-width="2"/>
  <circle cx="150" cy="38" r="4" fill="#1b4e9b"/>
  <!-- hoist cable -->
  <path d="M154 38 C200 60 205 300 206 356" stroke="#8b95a1" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- mast raising cylinder -->
  <line x1="172" y1="300" x2="244" y2="392" stroke="#1d2b3a" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <line x1="172" y1="300" x2="205" y2="342" stroke="#ffffff" stroke-width="2"/>

  <!-- rotation head -->
  <rect x="112" y="164" width="76" height="56" rx="4" fill="#ffffff" stroke="#1b4e9b" stroke-width="2.4"/>
  <line x1="122" y1="180" x2="178" y2="180" stroke="#1b4e9b" stroke-width="1"/>
  <line x1="122" y1="204" x2="178" y2="204" stroke="#1b4e9b" stroke-width="1"/>
  <!-- drill rod -->
  <line x1="150" y1="220" x2="150" y2="462" stroke="#1b4e9b" stroke-width="3"/>
  <!-- rod holder / foot clamp -->
  <rect x="130" y="370" width="40" height="14" rx="2" fill="#ffffff" stroke="#1d2b3a" stroke-width="1.6"/>

  <!-- dimension: height -->
  <g stroke="#8b95a1" stroke-width="1">
    <line x1="64" y1="30" x2="110" y2="30"/>
    <line x1="64" y1="462" x2="92" y2="462"/>
    <line x1="74" y1="34" x2="74" y2="458" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text x="66" y="250" fill="#5d6166" font-size="12" transform="rotate(-90 66 250)" text-anchor="middle">H 13 500</text>

  <!-- dimension: length -->
  <g stroke="#8b95a1" stroke-width="1">
    <line x1="534" y1="300" x2="534" y2="388"/>
    <line x1="70" y1="296" x2="534" y2="296" stroke-dasharray="2 4" opacity=".5"/>
  </g>

  <!-- callouts -->
  <g font-size="11" fill="#1d2b3a">
    <line x1="188" y1="190" x2="300" y2="150" stroke="#1d2b3a" stroke-width="1"/>
    <circle cx="300" cy="150" r="11" stroke="#1d2b3a" stroke-width="1.2" fill="#ffffff"/>
    <text x="300" y="154" text-anchor="middle">1</text>
    <text x="318" y="154" fill="#5d6166">ВРАЩАТЕЛЬ / ROTATION HEAD</text>

    <line x1="172" y1="90" x2="300" y2="90" stroke="#1d2b3a" stroke-width="1"/>
    <circle cx="300" cy="90" r="11" stroke="#1d2b3a" stroke-width="1.2" fill="#ffffff"/>
    <text x="300" y="94" text-anchor="middle">2</text>
    <text x="318" y="94" fill="#5d6166">МАЧТА / MAST</text>

    <line x1="360" y1="318" x2="380" y2="250" stroke="#1d2b3a" stroke-width="1"/>
    <circle cx="380" cy="244" r="11" stroke="#1d2b3a" stroke-width="1.2" fill="#ffffff"/>
    <text x="380" y="248" text-anchor="middle">3</text>
    <text x="398" y="248" fill="#5d6166">СИЛОВАЯ УСТАНОВКА</text>

    <line x1="206" y1="356" x2="300" y2="210" stroke="#1d2b3a" stroke-width="1"/>
    <circle cx="300" cy="206" r="11" stroke="#1d2b3a" stroke-width="1.2" fill="#ffffff"/>
    <text x="300" y="210" text-anchor="middle">4</text>
    <text x="318" y="210" fill="#5d6166">ЛЕБЁДКА / WINCH</text>
  </g>

  <!-- title block -->
  <g font-size="10" fill="#8b95a1">
    <rect x="440" y="30" width="170" height="54" stroke="#c4c9cf" fill="none"/>
    <line x1="440" y1="50" x2="610" y2="50" stroke="#c4c9cf"/>
    <text x="450" y="44" fill="#1b4e9b">CS-1200 · SIDE VIEW</text>
    <text x="450" y="64">SCALE 1:100 · DWG 01</text>
    <text x="450" y="77">EVERMONT DRILLING</text>
  </g>
</svg>
